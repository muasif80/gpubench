[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpubench"
version = "1.3.0"
description = "Benchmark a GPU inference machine, work out which ceiling binds it, and publish the result"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Muhammad Asif" }]
keywords = ["benchmark", "gpu", "inference", "roofline", "llm", "vllm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Benchmark",
]

# No runtime dependencies. Every probe, derivation, diagnostic and the report engine are standard
# library only, because the machines most worth measuring are the ones where nothing may be
# installed. PDF and DOCX export are the sole exception and are optional extras.
dependencies = []

[project.optional-dependencies]
pdf = ["playwright>=1.40", "pymupdf>=1.23"]

[project.scripts]
gpubench = "gpubench.cli:main"

[tool.setuptools]
packages = [
    "gpubench",
    "gpubench.probes",
    "gpubench.longform",
    "gpubench.template",
    "gpubench.template.tests",
]

# Non-Python files that ship INSIDE the package. setuptools copies only .py files unless a rule
# like this one names the rest, so without it `pip install .` produced a package whose linter
# could not load its own data contract: report-outline.yaml and run-schema.json were simply not
# there. The tar.gz and zip archives were never affected, because those are built by copying the
# tree and are proven by extracting them again, which is exactly why the installed path went
# unnoticed for so long.
#
# These patterns are a declaration, and a declaration is not evidence. tests/test_packaging.py
# builds a wheel with this backend and compares its contents against the package directory on
# disk, so a data file added later without a matching pattern fails a test instead of quietly
# vanishing from the installed copy.
[tool.setuptools.package-data]
"gpubench.template" = ["*.json", "*.md", "*.yaml"]
"gpubench.template.tests" = ["fixtures/*/*.html", "fixtures/*/*.json"]
