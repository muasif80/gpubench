# report-outline.yaml
# The section manifest for a benchmark report built from a run bundle that
# validates against run-schema.json. Domain-neutral by contract: nothing in this
# file names a kind of hardware, a numeric format, a device word or a workload
# word. Those live in the report's own config.

template:
  name: "benchmark-report-template"
  artifact: "report-outline.yaml"
  version: "1.0.0"
  released: "2026-08-26"
  previous_version: null
  versioning_rule: "This manifest carries its OWN version, advanced only when a section, an invariant or an archetype changes. It is never set equal to, derived from, or bumped alongside the version of any report built with it. A report edition advances when its numbers or its prose change (version_history[].version in the bundle); this file advances when the discipline changes. Two independent chains, and a build must print both."
  schema_contract: "run-schema.json"
  schema_contract_version: "1.x"
  refuse_unknown_schema_major: "true"
  purpose: "Fix which sections a report has, what feeds each one, and what must be true of each one AFTER rendering. Three rounds of external review of the source report found twelve defects and all twelve were the same failure mode: a number written into a sentence by hand, which then drifted from the value it was meant to restate. Every invariant below is a check on rendered output, because that is where the drift became visible and nowhere earlier."
  what_this_file_is_not: "Not a style guide, not a table of contents, and not a description of any one machine. A section whose invariants can only be satisfied by one kind of hardware is a bug in this file."
  ordering_rule: "The required entries appear here in their mandated relative order and a build may not reorder them. Optional entries are interleaved at their canonical position and may be dropped; dropping one never changes the relative order of the required ones. The order field is the canonical position, and a renderer assigns printed numbers from the surviving set at build time."
  numbering_rule: "A section number never appears in authored text, in this file, or in any bundle field. Cross-references are made by section id and resolved by the renderer to whatever number the section ends up with. D6."
  extension_rule: "B-C1. If a report needs to say something no entry here can express, EXTEND this file: add an archetype, or add a field to an entry. Never drop the claim from the report and never weaken an invariant to let a hand-written number through. Report-specific evidence sections are instantiated from the archetypes block, may repeat any number of times, and inherit every universal invariant."

vocabulary:
  rule: "B-C2. This file speaks only in neutral terms. A report supplies its own words through its config, and the renderer substitutes them. The same manifest must fit a processor, a storage array, a network fabric and an accelerator without editing."
  neutral_terms:
    - "roof, for any ceiling the work is measured against"
    - "unit, for one device under test"
    - "system under test, for the whole machine"
    - "workload, for whatever is submitted"
    - "problem size, for the size of the thing being worked on"
    - "rate, for work per unit time"
    - "quality gate, for a fixed test set with a pass rule"
    - "precision, for a numeric format or a fidelity level"
    - "interconnect, for any path between units"
    - "mode, for exclusive versus shared measurement"
  banned_in_template: "Lint blacklist for THIS file and for every invariant string in it, not for a report. Any domain-specific term for a device, an arithmetic format, a throughput unit, a workload item or a vendor product belongs in a report config only. A build must fail if one appears here."
  banned_term_classes:
    - "names of device families or vendor products"
    - "names of numeric formats or quantisation schemes"
    - "domain throughput units (use the bundle unit field)"
    - "domain workload nouns (use workload item)"
    - "domain nouns for correctness or answer quality (use quality gate)"

check_vocabulary:
  note: "Predicate names used by the invariants below. A linter implements these against the RENDERED document plus the bundle. Each predicate is decidable: it returns pass or fail with the offending location, never an opinion."
  predicates:
    - "no_authored_digits(section): no numeric literal appears in authored prose in this section. Digits are legal only inside a rendered value span carrying an envelope id, inside a block flagged verbatim, and inside a rendered identifier."
    - "all_rendered_values_resolve(section): every rendered value span names an envelope id that exists in roofs, measurements, derived or assumptions."
    - "rendered_ids_subset_of_declared(section): the set of envelope ids rendered here is a subset of this section's declared uses in sections[]."
    - "value_kind_present(section, kind, min): at least min rendered values in this section have envelope kind equal to kind."
    - "value_kind_absent(section, kind): no rendered value in this section has that kind."
    - "field_rendered_with_every(field, filter): for every rendered value matching filter, the named envelope field is rendered in the same block."
    - "block_present(section, block_id): the named block exists in the rendered section."
    - "block_order(section, first_block, second_block): first_block is rendered strictly before second_block."
    - "row_count_equals(table_id, bundle_expression): the rendered row count equals the count the bundle expression yields."
    - "exactly_one(selector): the selector matches exactly one rendered element."
    - "rendered_id_equals(location_a, location_b): the envelope id rendered at two locations is the same id, compared as an id and never as text."
    - "no_section_number_in_text(section): no reference to a section by printed number."
    - "cross_references_resolve(section): every section id referenced exists in the surviving section set."
    - "attributed_when_not_primary(section): every rendered value whose run_id is not the primary run carries the run id in the same block."
    - "floor_qualified(section): every rendered value that is a roof with is_floor true, or an envelope with inherits_floor true, is rendered with the bound wording at every occurrence in this section."
    - "single_precision_per_value(document): no envelope is rendered at two different precisions anywhere in the document."
    - "conditions_match_or_caveat(numerator_id, denominator_id): the comparability keys of both envelopes are equal, or the mismatch is rendered as a caveat in the same block."
    - "prohibition_honoured(document): no envelope is rendered in the same table or sentence as any id listed in its not_comparable_with."
    - "generated_from_flag(sentence_class, bundle_path): every sentence of that class is generated from the named bundle field and none is authored."
    - "chain_complete(list_path): following previous_version from the newest entry visits every entry exactly once and terminates at null exactly once."
    - "count_covered(bundle_path, sections): every entry at that bundle path is rendered in at least one of the named sections, and the union count matches the bundle count."
    - "no_first_appearance(section): every envelope id rendered here is also rendered in an earlier section."
    - "derivation_rendered(section): every rendered derived value shows its inputs and its formula in the same block."
    - "no_aggregate_across(field): no rendered value aggregates entries that differ on the named field."

universal_invariants:
  note: "Apply to EVERY section, including optional entries and every archetype instance. A section entry never restates these; its own invariants are the ones specific to it."
  invariants:
    - id: "U-1"
      rule: "Every digit printed in the section comes from a rendered value span that names an envelope id, or from a block flagged verbatim. Authored prose contains no numerals."
      check: "no_authored_digits(section) and all_rendered_values_resolve(section)"
      cites: "D1, D3, D4"
    - id: "U-2"
      rule: "The set of envelope ids rendered in the section is a subset of the ids the section declares it uses, so an unlisted number cannot appear."
      check: "rendered_ids_subset_of_declared(section)"
      cites: "D1"
    - id: "U-3"
      rule: "No section is referenced by printed number, and every section id referenced resolves in the surviving section set."
      check: "no_section_number_in_text(section) and cross_references_resolve(section)"
      cites: "D6"
    - id: "U-4"
      rule: "Any value taken from a run other than the primary run is attributed to that run in the same block where it is printed."
      check: "attributed_when_not_primary(section)"
      cites: "D10, D3"
    - id: "U-5"
      rule: "Any value that is a floor, or that inherits a floor through its inputs, is rendered with bound wording at every occurrence, not once per document."
      check: "floor_qualified(section)"
      cites: "shared-mode rule, D1"
    - id: "U-6"
      rule: "Every rendered value of kind assumption or projection is rendered with its kind label and its rationale in the same block."
      check: "field_rendered_with_every(rationale, kind in [assumption, projection]) and field_rendered_with_every(kind_label, kind in [assumption, projection])"
      cites: "D8"
    - id: "U-7"
      rule: "Every rendered value of kind published is rendered with its citation and its unpacking, and is never labelled measured."
      check: "field_rendered_with_every(provenance.unpacking, kind = published)"
      cites: "D4"
    - id: "U-8"
      rule: "Every value flagged illustrative_only is marked as not citable in the same block, because a number is cited from wherever it is read."
      check: "field_rendered_with_every(illustrative_only_marker, illustrative_only = true)"
      cites: "D8"
    - id: "U-9"
      rule: "Every rendered value prints its unit, including dimensionless ones, and prints at the single precision stored on its envelope."
      check: "field_rendered_with_every(unit, all) and single_precision_per_value(document)"
      cites: "D1, D3"
    - id: "U-10"
      rule: "No two values are set beside each other in one table or one sentence when either lists the other in not_comparable_with."
      check: "prohibition_honoured(document)"
      cites: "D4"
    - id: "U-11"
      rule: "Every rendered value carrying a caveat renders that caveat with it, in every section where the value appears."
      check: "field_rendered_with_every(caveat, caveat present)"
      cites: "D4"

sections:

  - id: "document-control"
    title: "Document control"
    required: true
    order: 1
    purpose: "Establish, before any result is shown, which run artefacts contributed, which harness produced them, what edition the reader is holding, and what the bundle itself warned about."
    inputs:
      - "schema_version"
      - "generated_at"
      - "tool"
      - "runs"
      - "cross_run_blends"
      - "warnings"
      - "version_history[0]"
      - "system_under_test.sanitised"
    invariants:
      - id: "DC-1"
        rule: "The run register renders exactly one row per runs[] entry, with id, window, role, mode, harness_version and comparability_fingerprint.hash, and exactly one row is marked primary."
        check: "row_count_equals(run_register, count(runs)) and exactly_one(run_register row with primary true)"
        cites: "D10"
      - id: "DC-2"
        rule: "No sentence here asserts a single run, a single directory or a single machine state unless runs[] holds exactly one entry; the count is generated from runs[], never authored."
        check: "generated_from_flag(run_count_sentence, runs)"
        cites: "D10"
      - id: "DC-3"
        rule: "Every cross_run_blends[] entry is rendered here with its run ids and its why_permissible, and each named target section also renders the same disclosure in place."
        check: "row_count_equals(blend_table, count(cross_run_blends)) and block_present(target_section, blend_disclosure)"
        cites: "D10, D4"
      - id: "DC-4"
        rule: "Every entry of bundle warnings[] and of runs[].warnings is rendered here or in limitations, and the union count equals the bundle count. A suppressed warning is a lint failure, not an editorial choice."
        check: "count_covered(warnings + runs[].warnings, [document-control, limitations])"
        cites: "shared-mode rule"
      - id: "DC-5"
        rule: "The edition identity rendered here is generated from version_history[0] and matches the identity rendered in version-history, compared as strings from one source."
        check: "rendered_id_equals(document-control.edition, version-history.newest)"
        cites: "D7"
    anti_pattern: "A cover that describes the measurement the author wishes had been run: one directory, one machine state, one clean window, while three artefacts of differing modes fed the tables and nothing on the page could have revealed it."

  - id: "abstract"
    title: "Abstract"
    required: true
    order: 2
    purpose: "State in one passage the question, the machine, which roof the work actually hits, and the single figure the report will be cited for."
    inputs:
      - "figures_of_merit.primary"
      - "roofs"
      - "derived"
      - "runs"
      - "workload.not_claimed"
    invariants:
      - id: "AB-1"
        rule: "Every value rendered here is also rendered in headline or findings; the abstract may not introduce an envelope id that appears nowhere else."
        check: "no_first_appearance(abstract)"
        cites: "D1"
      - id: "AB-2"
        rule: "The roof named as binding is rendered by id, and that id is identical to the one workload-vs-roofs and findings name as binding. The comparison is on ids, never on the words around them."
        check: "rendered_id_equals(abstract.binding_roof, workload-vs-roofs.binding_roof) and rendered_id_equals(abstract.binding_roof, findings.binding_roof)"
        cites: "D1"
      - id: "AB-3"
        rule: "Any comparison against another system or a vendor figure renders a published envelope whose provenance.comparable_to_measured is true; a published value flagged not comparable may not be compared here."
        check: "value_kind_present(abstract, published, 0) and field_rendered_with_every(provenance.comparable_to_measured, kind = published)"
        cites: "D4"
      - id: "AB-4"
        rule: "At least one non-claim from workload.not_claimed or scope.non_claims is rendered in the abstract, so the limit travels with the summary a reader will quote."
        check: "value_kind_present(abstract, non_claim, 1)"
        cites: "D9"
    anti_pattern: "An abstract written first, before the matrices were size-controlled, and never regenerated, so it carries the numbers the report had two drafts ago while every table has moved on."

  - id: "headline"
    title: "Headline figures"
    required: true
    order: 3
    purpose: "Present the small set of figures the report will be cited for, each with its unit, its conditions and its run visible in the same row."
    inputs:
      - "figures_of_merit"
      - "measurements"
      - "derived"
      - "roofs"
      - "runs"
      - "presentation"
    invariants:
      - id: "HL-1"
        rule: "Every row resolves to exactly one envelope id. Nothing is computed at render time: a figure that is a ratio of two others exists as a derived[] entry or it does not appear."
        check: "all_rendered_values_resolve(headline) and value_kind_absent(headline, render_time_arithmetic)"
        cites: "D1"
      - id: "HL-2"
        rule: "Every row renders the conditions that make it comparable: duration_class always, plus problem_size, concurrency, precision, percentile and mode wherever the envelope carries them."
        check: "field_rendered_with_every(conditions.duration_class, all) and field_rendered_with_every(conditions, all)"
        cites: "D4, D3"
      - id: "HL-3"
        rule: "figures_of_merit.primary.value_id is the first row, and every id in its bound_by is rendered adjacent to it. A rate printed without its bound is not a headline figure."
        check: "exactly_one(headline first row) and rendered_id_equals(headline.first_row, figures_of_merit.primary.value_id) and field_rendered_with_every(bound_by, primary)"
        cites: "D4"
      - id: "HL-4"
        rule: "Every row whose envelope aggregates over units renders aggregation.over, aggregation.method and aggregation.unit_count, so a per-unit reading and a total can never be confused."
        check: "field_rendered_with_every(aggregation, aggregation.over = units)"
        cites: "D2"
      - id: "HL-5"
        rule: "No row appears in this table beside any id listed in its not_comparable_with, and no row is a value flagged illustrative_only."
        check: "prohibition_honoured(headline) and value_kind_absent(headline, illustrative_only)"
        cites: "D4"
    anti_pattern: "A summary box maintained by hand because it is only the highlights, which is exactly how one measurement came to be printed as three different percentages in three places."

  - id: "what-this-is"
    title: "What this is, and what it is not"
    required: true
    order: 4
    purpose: "Say which question the report answers, for whom, and which questions it refuses, before the reader forms an expectation the results cannot meet."
    inputs:
      - "scope"
      - "workload.not_claimed"
      - "figures_of_merit"
      - "notes"
    invariants:
      - id: "WTI-1"
        rule: "At least one non-claim is rendered, drawn from scope.non_claims or workload.not_claimed. A scope section with no refusals is a lint failure."
        check: "value_kind_present(what-this-is, non_claim, 1)"
        cites: "D9"
      - id: "WTI-2"
        rule: "Every scope.borrowed_frameworks entry is rendered with its not_claimed line in the same block, so a borrowed vocabulary cannot be read as a conformance claim."
        check: "row_count_equals(borrowings_table, count(scope.borrowed_frameworks)) and field_rendered_with_every(not_claimed, borrowed_framework)"
        cites: "D9"
      - id: "WTI-3"
        rule: "scope.governing_rule is rendered verbatim when present, and it is the rule the rest of the document is linted against."
        check: "block_present(what-this-is, governing_rule)"
        cites: "D1"
      - id: "WTI-4"
        rule: "No result value is introduced here. Any value rendered must already appear in headline."
        check: "no_first_appearance(what-this-is)"
        cites: "D1"
    anti_pattern: "A scope section that lists everything the report covers and nothing it refuses, so the borrowed method names read as certification and the reader supplies the claims the author avoided making."

  - id: "figures-of-merit"
    title: "Figures of merit"
    required: true
    order: 5
    purpose: "Fix the one quantity the report ranks on, and the bound it is only valid under, before any result can be arranged to flatter a different quantity."
    inputs:
      - "figures_of_merit"
      - "measurements"
      - "derived"
      - "roofs"
    invariants:
      - id: "FOM-1"
        rule: "Exactly one primary figure is rendered and its value_id resolves to an envelope in the bundle."
        check: "exactly_one(primary_figure) and all_rendered_values_resolve(figures-of-merit)"
        cites: "D1"
      - id: "FOM-2"
        rule: "The primary figure renders every id in bound_by. A primary figure rendered without its bound is a lint failure even when the bound is stated elsewhere."
        check: "field_rendered_with_every(bound_by, primary)"
        cites: "D4"
      - id: "FOM-3"
        rule: "Findings and recommendations may rank only on ids in the union of primary, secondary and efficiency declared here; a ranking claim on any other id fails the build."
        check: "rendered_ids_subset_of_declared(findings.ranking_ids) and rendered_ids_subset_of_declared(recommendations.ranking_ids)"
        cites: "D1"
      - id: "FOM-4"
        rule: "Every figures_of_merit.self_assessment entry is rendered, including entries whose verdict is negative or absent. Selecting the flattering rows is a lint failure."
        check: "row_count_equals(self_assessment_table, count(figures_of_merit.self_assessment))"
        cites: "D12"
    anti_pattern: "Optimising for a rate in one section and for a latency in another, so the machine looks good in both and is characterised in neither, and no reader can tell which number the report is actually claiming."

  - id: "system-under-test"
    title: "System under test"
    required: true
    order: 6
    purpose: "Describe the measured machine precisely enough that a reader can decide whether their machine is the same machine."
    inputs:
      - "system_under_test"
      - "runs[].machine_fingerprint"
      - "runs[].comparability_fingerprint"
      - "roofs"
    invariants:
      - id: "SUT-1"
        rule: "One row per system_under_test.units[] entry, with index, model, firmware, attachment.nominal, attachment.negotiated, attachment.upstream and limits rendered per unit and never collapsed across units."
        check: "row_count_equals(units_table, count(system_under_test.units)) and no_aggregate_across(unit_index)"
        cites: "D2"
      - id: "SUT-2"
        rule: "system_under_test.topology is rendered verbatim from the bundle, in a block flagged verbatim, not paraphrased into prose."
        check: "block_present(system-under-test, topology_verbatim)"
        cites: "D2"
      - id: "SUT-3"
        rule: "The machine_fingerprint of every contributing run is rendered, and where two runs differ the difference is rendered as a warning rather than silently reduced to one fingerprint."
        check: "row_count_equals(fingerprint_rows, count(distinct runs[].machine_fingerprint))"
        cites: "D10"
      - id: "SUT-4"
        rule: "When any roof has is_floor true, system_under_test.measurement_state_note is rendered here as well as at the roof, so a reader entering mid-document meets the caveat where they are."
        check: "block_present(system-under-test, measurement_state_note) when any(roofs.is_floor)"
        cites: "shared-mode rule"
      - id: "SUT-5"
        rule: "system_under_test.sanitised.removed and .retained are rendered when present, so a redacted disclosure can still be assessed for completeness."
        check: "block_present(system-under-test, sanitised) when present(system_under_test.sanitised)"
        cites: "D9"
    anti_pattern: "Two identical model strings listed once, so the section quietly asserts the units are interchangeable while one of them is attached through a narrower path, which later turns out to be the finding."

  - id: "software-stack"
    title: "The execution stack is part of the measurement"
    required: true
    order: 7
    purpose: "Publish the stack and its launch configuration as data, because a different stack on the same hardware is a different measurement and a reader must be able to match it."
    inputs:
      - "software_stack"
      - "tool"
      - "runs[].harness_version"
    invariants:
      - id: "SS-1"
        rule: "software_stack.configuration.verbatim is rendered exactly, in a block flagged verbatim. A reconstructed invocation is a guess and may not stand in for it."
        check: "block_present(software-stack, configuration_verbatim)"
        cites: "D9"
      - id: "SS-2"
        rule: "One row per configuration.flags[] entry, each rendering flag, value, resolved_value where it differs, and effect. A flag rendered without its effect on the numbers is a lint failure."
        check: "row_count_equals(flags_table, count(software_stack.configuration.flags)) and field_rendered_with_every(effect, flag)"
        cites: "D9"
      - id: "SS-3"
        rule: "Every flag with invalidates_comparison true is marked as comparison-breaking in its own row, not in a footnote."
        check: "field_rendered_with_every(invalidates_comparison_marker, invalidates_comparison = true)"
        cites: "D4"
      - id: "SS-4"
        rule: "One row per software_stack.components[] entry with name, version and role, and the harness itself appears with the version recorded on the primary run."
        check: "row_count_equals(components_table, count(software_stack.components)) and rendered_id_equals(software-stack.harness_version, runs.primary.harness_version)"
        cites: "D10"
      - id: "SS-5"
        rule: "Resource split values are rendered by reference to configuration.resource_accounting ids, never restated, so a later capacity argument cannot use a second number for the same quantity."
        check: "rendered_ids_subset_of_declared(software-stack.resource_ids)"
        cites: "D1"
    anti_pattern: "A stack section that lists versions and calls the launch flags an implementation detail, so a comparison against another system is a category error nobody can detect from the page."

  - id: "workload"
    title: "The workload is part of the measurement"
    required: true
    order: 8
    purpose: "Disclose what was actually submitted, how its size was controlled, and how it avoids measuring a cache instead of the machine."
    inputs:
      - "workload"
      - "workload.secondary_workloads"
      - "assumptions"
    invariants:
      - id: "WL-1"
        rule: "workload.corpus_kind is rendered, and with it the recipe or the corpus identity the schema requires for that kind: generation.template, generation.uniqueness_mechanism and generation.seed for a synthetic corpus, corpus.identity, corpus.version and corpus.licence otherwise."
        check: "block_present(workload, corpus_disclosure) and field_rendered_with_every(generation_or_corpus, corpus_kind)"
        cites: "D8"
      - id: "WL-2"
        rule: "size_control.verification renders one row per entry, each with requested, counted, ratio and counter_source. A single headline ratio standing in for the per-size table is a lint failure, and size_control.basis_for_reported_rates is rendered beside it."
        check: "row_count_equals(size_verification_table, count(workload.size_control.verification)) and block_present(workload, basis_for_reported_rates)"
        cites: "D1, D4"
      - id: "WL-3"
        rule: "uniqueness_and_cache_defeat renders the policy, the cache_counters source, the counter readings, resolved_state and interpretation. An argument that the cache was defeated by construction, with no counter reading, fails the build."
        check: "block_present(workload, cache_counters) and field_rendered_with_every(resolved_state, cache_counters)"
        cites: "D9"
      - id: "WL-4"
        rule: "When workload.distribution is present its kind is rendered as a label on the mixture itself, and when kind is assumption the rationale is rendered in the same block. When weighted_summary_permitted is false, no weighted single figure derived from that mixture appears anywhere in the document."
        check: "field_rendered_with_every(distribution.kind_label, distribution) and value_kind_absent(document, weighted_summary_of_unpermitted_mixture)"
        cites: "D8"
      - id: "WL-5"
        rule: "workload.why_this_workload and workload.not_claimed are both rendered. A section that lists only what the choice buys is advocacy, and every secondary workload renders its own full disclosure rather than inheriting this one."
        check: "block_present(workload, why_this_workload) and block_present(workload, not_claimed) and row_count_equals(secondary_workload_blocks, count(workload.secondary_workloads))"
        cites: "D8, D9"
    anti_pattern: "The inputs described once, in a subordinate clause, as synthetic, while every rate in the document depends on the input distribution and no reader can regenerate a single request."

  - id: "metrics"
    title: "Metrics"
    required: true
    order: 9
    purpose: "Define every quantity the report prints, with its unit and its bound, so no two sections can mean different things by one word."
    inputs:
      - "measurements"
      - "derived"
      - "roofs"
      - "figures_of_merit"
      - "presentation"
    invariants:
      - id: "MT-1"
        rule: "Every metric name used anywhere in the document is defined here exactly once, and every definition renders its unit, including an explicit unit for dimensionless quantities."
        check: "count_covered(document.metric_names, [metrics]) and field_rendered_with_every(unit, metric_definition)"
        cites: "D1"
      - id: "MT-2"
        rule: "Every latency-style or distribution-style metric renders the percentile or service_level it is quoted at. A percentile-free latency definition is a lint failure."
        check: "field_rendered_with_every(conditions.percentile_or_service_level, latency_metric)"
        cites: "D4"
      - id: "MT-3"
        rule: "No example value is authored in a definition. Where a definition shows a value it references an envelope id, and where it shows a shape only it is flagged illustrative_only."
        check: "no_authored_digits(metrics)"
        cites: "D1"
      - id: "MT-4"
        rule: "Each metric definition states whether the quantity is counted by the system, counted by the harness or derived, matching the kind of the envelopes that carry it."
        check: "field_rendered_with_every(kind, metric_definition)"
        cites: "D5"
    anti_pattern: "A metric defined loosely enough that a burst reading and a sustained reading both qualify, which is how two figures measured under different conditions end up in one column."

  - id: "metric-origins"
    title: "Where these metrics come from"
    required: false
    order: 10
    purpose: "Name the instrument, counter or log behind each metric, so a reader can go and read the same source."
    inputs:
      - "measurements"
      - "derived"
      - "workload.size_control"
      - "software_stack"
    invariants:
      - id: "MO-1"
        rule: "Every metric defined in metrics appears here exactly once with the envelope source string that produced it. A source such as the benchmark is not a source and fails the check on specificity length."
        check: "count_covered(metrics.metric_names, [metric-origins]) and field_rendered_with_every(source, metric)"
        cites: "D5"
      - id: "MO-2"
        rule: "Metrics counted by the system are distinguished from metrics computed by the harness, and workload.size_control.basis_for_reported_rates is rendered where the two units differ."
        check: "field_rendered_with_every(counter_owner, metric) and block_present(metric-origins, basis_for_reported_rates)"
        cites: "D5"
      - id: "MO-3"
        rule: "No value is rendered here at all; this section maps names to instruments and carries no digits."
        check: "no_authored_digits(metric-origins)"
        cites: "D1"
    anti_pattern: "A provenance story told at the level of the tool rather than the counter, so nobody can tell which of two counters disagreeing by a few percent produced the printed figure."

  - id: "provenance"
    title: "Source of every value"
    required: true
    order: 11
    purpose: "Render one row for every value in the bundle, so the reader can audit the whole set rather than the values the author chose to footnote."
    inputs:
      - "measurements"
      - "derived"
      - "assumptions"
      - "roofs"
      - "runs"
      - "cross_run_blends"
      - "tool"
    invariants:
      - id: "PV-1"
        rule: "One row per envelope across roofs, measurements, derived and assumptions taken together, and the row count equals the bundle count. A value in the bundle and absent from this table is a lint failure, as is a row with no envelope."
        check: "row_count_equals(provenance_table, count(roofs) + count(measurements) + count(derived) + count(assumptions))"
        cites: "D1, D3"
      - id: "PV-2"
        rule: "Every row renders kind, source, run_id, unit, n, spread or spread_not_available, and the comparability keys of conditions."
        check: "field_rendered_with_every(kind, row) and field_rendered_with_every(source, row) and field_rendered_with_every(run_id, row) and field_rendered_with_every(spread_or_reason, row)"
        cites: "D3, D4"
      - id: "PV-3"
        rule: "Every derived row renders its inputs by id and its formula as text a reader can execute with a calculator, plus computed_by. A derived value whose derivation is not on the page fails the build."
        check: "derivation_rendered(provenance)"
        cites: "D5"
      - id: "PV-4"
        rule: "Every row with requires_inputs_present false renders the rationale for the fallback, so a derivation that would answer confidently on a machine missing an input is visible as such."
        check: "field_rendered_with_every(fallback_rationale, requires_inputs_present = false)"
        cites: "D11"
      - id: "PV-5"
        rule: "Every row whose envelope aggregates over units renders aggregation.over, aggregation.method, aggregation.unit_count and, where present, the per_unit values."
        check: "field_rendered_with_every(aggregation, aggregation.over = units)"
        cites: "D2"
    anti_pattern: "A provenance appendix listing the values the author remembered to register, so the one number that drifted is precisely the one with no row."

  - id: "assumptions"
    title: "Assumptions"
    required: true
    order: 12
    purpose: "Collect every value that was chosen rather than observed, with its rationale, so a reader can discount every conclusion resting on it."
    inputs:
      - "assumptions"
      - "workload.distribution"
      - "cost_model"
    invariants:
      - id: "AS-1"
        rule: "One row per assumptions[] entry, and the row count equals the bundle count. An assumption used in a derivation and absent here is a lint failure."
        check: "row_count_equals(assumptions_table, count(assumptions))"
        cites: "D8"
      - id: "AS-2"
        rule: "Every row renders the kind label (assumption or projection), the rationale, and what would change if the value were wrong."
        check: "field_rendered_with_every(kind_label, row) and field_rendered_with_every(rationale, row)"
        cites: "D8"
      - id: "AS-3"
        rule: "Every projection renders how_to_close, so a value outside the measured envelope carries the run that would bring it inside."
        check: "field_rendered_with_every(how_to_close, kind = projection)"
        cites: "D8"
      - id: "AS-4"
        rule: "Every derived value in the bundle whose inputs include an assumption or a projection is listed here as a dependent, so the blast radius of a wrong assumption is on the page rather than reverse-engineered."
        check: "count_covered(derived[with assumption inputs], [assumptions])"
        cites: "D8, D5"
    anti_pattern: "A mixture, a duty cycle or a tariff presented in the voice the measured sections use, so a reader carries it forward as an observation and every conclusion built on it inherits a confidence it never had."

  - id: "strategy"
    title: "Benchmarking strategy"
    required: false
    order: 13
    purpose: "Explain what each measurement pass was for and what state the machine was in for it, before any result is presented."
    inputs:
      - "runs"
      - "tool"
      - "figures_of_merit"
      - "workload"
    invariants:
      - id: "SG-1"
        rule: "One described pass per runs[] entry, each rendering role, mode and window from the bundle. A pass described here with no run, or a run with no described pass, fails the build."
        check: "row_count_equals(pass_table, count(runs))"
        cites: "D10"
      - id: "SG-2"
        rule: "Each pass renders its mode as exclusive or shared, taken from runs[].mode, because the mode determines whether the roofs from that pass are ceilings or floors."
        check: "field_rendered_with_every(mode, pass)"
        cites: "shared-mode rule"
      - id: "SG-3"
        rule: "No result value is rendered here; forward references are by section id only."
        check: "no_authored_digits(strategy) and no_section_number_in_text(strategy)"
        cites: "D1, D6"
    anti_pattern: "A method narrative that describes the passes the author intended rather than the runs that exist, so a pass that was never completed still shapes the reader's confidence."

  - id: "roofs"
    title: "The roofs"
    required: true
    order: 14
    purpose: "Establish each ceiling the work is measured against, its class, and whether the measurement produced a ceiling or only a floor."
    inputs:
      - "roofs"
      - "runs"
      - "system_under_test.measurement_state_note"
      - "derived"
      - "warnings"
    invariants:
      - id: "RF-1"
        rule: "MANDATORY AND NOT REMOVABLE. Every roof renders its measurement mode explicitly as exclusive or shared, in the same block as its value. A roof rendered without its mode fails the build, whatever else the section says."
        check: "field_rendered_with_every(mode, roof)"
        cites: "shared-mode rule, D3"
      - id: "RF-2"
        rule: "MANDATORY AND NOT REMOVABLE. Every roof with is_floor true is rendered as a FLOOR at every occurrence, and the section renders the consequence block stating that any fraction computed against it is an upper bound on achievement and that the true ceiling is at least this high and unknown. how_to_measure_true_ceiling is rendered with it. A future author who deletes this block deletes the only thing standing between a floor and every percentage downstream of it."
        check: "floor_qualified(roofs) and block_present(roofs, floor_consequence) and field_rendered_with_every(how_to_measure_true_ceiling, is_floor = true)"
        cites: "shared-mode rule, D1"
      - id: "RF-3"
        rule: "Every roof renders roof_class and binding_regime, and no rendered value averages or combines two roofs that bind in different regimes."
        check: "field_rendered_with_every(roof_class, roof) and field_rendered_with_every(binding_regime, roof) and no_aggregate_across(binding_regime)"
        cites: "D1"
      - id: "RF-4"
        rule: "A roof of kind published renders its citation, its unpacking and vendor_conditions, and is visually distinguished from a measured roof. A vendor ceiling presented as a measured one fails the build."
        check: "field_rendered_with_every(provenance.unpacking, kind = published) and field_rendered_with_every(kind_label, roof)"
        cites: "D4"
      - id: "RF-5"
        rule: "Every roof declaring a ridge renders that derived value with its inputs and its formula, because the crossover point is the reason a roof analysis says anything and an unpublished derivation of it cannot be checked."
        check: "derivation_rendered(roofs.ridge) and field_rendered_with_every(formula, ridge)"
        cites: "D5"
    anti_pattern: "A ceiling table that prints a number per roof and leaves the machine state to the methodology section, so a floor measured while other work was resident becomes the denominator of every percentage in the report and no page ever says so."

  - id: "datasheet-vs-measured"
    title: "Published figures versus measured"
    required: false
    order: 15
    purpose: "Set each vendor or reference figure beside its measured counterpart, with the unpacking that makes the pair a fair comparison, or state that no fair pair exists."
    inputs:
      - "measurements"
      - "roofs"
      - "derived"
    invariants:
      - id: "DVM-1"
        rule: "Every published row renders headline_value, headline_unit, the full unpacking chain, and vendor_conditions including an explicit statement where the vendor did not state them."
        check: "field_rendered_with_every(provenance, kind = published)"
        cites: "D4"
      - id: "DVM-2"
        rule: "No shortfall or achievement fraction is rendered for a published value whose provenance.comparable_to_measured is false; that row renders the reason no comparison is possible instead."
        check: "value_kind_absent(datasheet-vs-measured, fraction_over_incomparable_published)"
        cites: "D4"
      - id: "DVM-3"
        rule: "Every comparison renders the comparability keys of both sides, and where they differ the mismatch is rendered as a caveat rather than smoothed over."
        check: "conditions_match_or_caveat(measured_id, published_id)"
        cites: "D4"
      - id: "DVM-4"
        rule: "No pair is rendered that either side prohibits through not_comparable_with."
        check: "prohibition_honoured(datasheet-vs-measured)"
        cites: "D4"
    anti_pattern: "A vendor headline set beside a measured figure with the unpacking left out, so a best case obtained under conditions the run did not share becomes the denominator of an efficiency claim."

  - id: "workload-vs-roofs"
    title: "The workload against the roofs"
    required: true
    order: 16
    purpose: "Show which roof binds in which regime, and what fraction of each roof the workload reaches, with the denominator named at every point."
    inputs:
      - "roofs"
      - "measurements"
      - "derived"
      - "figures"
      - "workload"
    invariants:
      - id: "WVR-1"
        rule: "Every fraction or percentage renders the id of its denominator envelope in the same block. A percentage whose denominator is described in words only fails the build."
        check: "field_rendered_with_every(denominator_id, fraction)"
        cites: "D1"
      - id: "WVR-2"
        rule: "For every fraction, the numerator and denominator envelopes agree on the comparability keys (problem_size, precision, concurrency, duration_class, mode), or the mismatch is rendered as a caveat beside the number."
        check: "conditions_match_or_caveat(numerator_id, denominator_id)"
        cites: "D4"
      - id: "WVR-3"
        rule: "Every fraction whose denominator roof has is_floor true is itself an envelope with inherits_floor true, and renders as an upper bound on achievement in every place it appears."
        check: "floor_qualified(workload-vs-roofs) and field_rendered_with_every(inherits_floor, fraction over floor)"
        cites: "shared-mode rule, D1"
      - id: "WVR-4"
        rule: "The roof named as binding here is rendered by id and is identical to the id named binding in abstract, headline and findings."
        check: "rendered_id_equals(workload-vs-roofs.binding_roof, findings.binding_roof)"
        cites: "D1"
      - id: "WVR-5"
        rule: "No envelope is rendered at two precisions across this section and any other, and no fraction is recomputed in prose from two rendered values."
        check: "single_precision_per_value(document) and no_authored_digits(workload-vs-roofs)"
        cites: "D1"
    anti_pattern: "The same achievement fraction printed three times at three roundings because the tables were regenerated and the sentences were not, each looking equally authoritative."

  - id: "reproducibility"
    title: "Reproducibility, measured"
    required: true
    order: 17
    purpose: "State how much the measurements move between and within runs, and derive from that the threshold above which a difference is a finding rather than noise."
    inputs:
      - "measurements"
      - "derived"
      - "runs"
      - "tool"
    invariants:
      - id: "RE-1"
        rule: "The reproducibility threshold is rendered as a derived envelope whose inputs are the spread fields of named measurements, with its formula on the page. An asserted threshold fails the build."
        check: "derivation_rendered(reproducibility.threshold) and value_kind_present(reproducibility, derived, 1)"
        cites: "D5, D1"
      - id: "RE-2"
        rule: "Every spread rendered here declares its scope (within-run, between-run, across-units, across-conditions) and its n or n_runs. A between-run spread quoted as a within-run one fails the build."
        check: "field_rendered_with_every(spread.scope, spread) and field_rendered_with_every(n_or_n_runs, spread)"
        cites: "D2, D3"
      - id: "RE-3"
        rule: "Every value with n greater than one and no spread renders its spread_not_available reason, so an instrument that reports only an aggregate is visible rather than silent."
        check: "field_rendered_with_every(spread_not_available, n > 1 and no spread)"
        cites: "D3"
      - id: "RE-4"
        rule: "Statements about whether anyone outside has reproduced the result are generated from tool.published and tool.source_url, never authored, so no two sections can disagree about it."
        check: "generated_from_flag(reproduction_status_sentence, tool.published)"
        cites: "D9"
    anti_pattern: "A stability claim expressed as a round threshold nobody derived, so a between-edition difference smaller than the noise gets reported as an improvement."

  - id: "quality-gate"
    title: "Quality gate"
    required: true
    order: 18
    purpose: "Report the fixed test set, in full, with what a pass licenses and what it does not, so the result is falsifiable rather than a claim about the author."
    inputs:
      - "measurements[kind = fixed-test-set]"
      - "derived"
      - "runs"
    invariants:
      - id: "QG-1"
        rule: "Every case in the fixed-test-set envelope is rendered, with id, input verbatim, accept criterion, observed and passed. The rendered case count equals the count in the bundle. A gate whose cases are summarised rather than published fails the build."
        check: "row_count_equals(cases_table, count(envelope.cases))"
        cites: "D12"
      - id: "QG-2"
        rule: "The pass count and pass rate are rendered from derived envelopes computed over cases[], never authored, so the verdict and the table cannot disagree."
        check: "no_authored_digits(quality-gate) and derivation_rendered(quality-gate.pass_rate)"
        cites: "D12, D1"
      - id: "QG-3"
        rule: "licenses and does_not_license are rendered adjacent to the verdict, in the same block. A pass rendered without both lines fails the build."
        check: "block_present(quality-gate, licenses) and block_present(quality-gate, does_not_license) and block_order(quality-gate, verdict, does_not_license)"
        cites: "D12"
      - id: "QG-4"
        rule: "method.procedure, method.scoring and method.repeats are rendered, and where repeats exceeds one, stable_across_repeats is rendered per case."
        check: "block_present(quality-gate, method) and field_rendered_with_every(stable_across_repeats, repeats > 1)"
        cites: "D12"
      - id: "QG-5"
        rule: "No sentence in this section generalises the gate into a capability claim about the system; the only claim rendered is the licenses text."
        check: "rendered_ids_subset_of_declared(quality-gate.claim_ids)"
        cites: "D12"
    anti_pattern: "A gate reported as all cases passing, with the cases held back, so the reader can neither reproduce it nor object to it and the number does nothing except look like evidence."

  - id: "cost"
    title: "Cost per unit of work"
    required: false
    order: 19
    purpose: "Turn supplied capital, assumed tariffs and measured rates into a cost per unit of work, with the assumed half of the number visible."
    inputs:
      - "cost_model"
      - "assumptions"
      - "measurements"
      - "derived"
    invariants:
      - id: "CO-1"
        rule: "Every cost_model.input_ids entry is rendered with its kind and, for supplied values, supplied_by, and for assumptions, the rationale. A cost input rendered without its kind fails the build."
        check: "row_count_equals(cost_inputs_table, count(cost_model.input_ids)) and field_rendered_with_every(kind_label, cost_input)"
        cites: "D8"
      - id: "CO-2"
        rule: "cost_model.exclusions is rendered and non-empty, in the same block as the cost figure. A cost per unit with no exclusions list is always wrong."
        check: "block_present(cost, exclusions) and row_count_equals(exclusions_list, count(cost_model.exclusions))"
        cites: "D8"
      - id: "CO-3"
        rule: "Every scenario is a derived envelope rendering its inputs and its formula, so a reader can rebuild the figure at their own tariff."
        check: "derivation_rendered(cost) and row_count_equals(scenario_rows, count(cost_model.scenario_ids))"
        cites: "D5"
      - id: "CO-4"
        rule: "Any duty-cycle or utilisation multiplier is rendered with its assumption label, and where it is flagged illustrative_only it is marked as not citable in the same block."
        check: "field_rendered_with_every(kind_label, multiplier) and field_rendered_with_every(illustrative_only_marker, illustrative_only = true)"
        cites: "D8"
    anti_pattern: "A single headline cost per unit computed at one assumed duty cycle, quoted onward without the assumption, so a chosen number circulates as a measured one."

  - id: "findings"
    title: "Findings"
    required: true
    order: 20
    purpose: "State what the measurements establish, each finding tied to the values that support it and to the limits those values carry."
    inputs:
      - "roofs"
      - "measurements"
      - "derived"
      - "assumptions"
      - "figures_of_merit"
    invariants:
      - id: "FN-1"
        rule: "Every finding references at least one envelope id. A finding with no value reference is an opinion and fails the build."
        check: "value_kind_present(findings, any, 1) and all_rendered_values_resolve(findings)"
        cites: "D1"
      - id: "FN-2"
        rule: "No envelope id makes its first appearance in this section. Every value cited in a finding is rendered earlier in an evidence section."
        check: "no_first_appearance(findings)"
        cites: "D1"
      - id: "FN-3"
        rule: "The binding roof named in the principal finding is the same id named in workload-vs-roofs, abstract and headline."
        check: "rendered_id_equals(findings.binding_roof, workload-vs-roofs.binding_roof)"
        cites: "D1"
      - id: "FN-4"
        rule: "Any finding whose supporting values include an assumption or a projection renders that dependency in the same block as the finding."
        check: "field_rendered_with_every(kind_label, kind in [assumption, projection])"
        cites: "D8"
      - id: "FN-5"
        rule: "Any finding that attributes an effect to a mechanism renders the caveat carried by its supporting values, including the evidence that would settle the attribution."
        check: "field_rendered_with_every(caveat, caveat present)"
        cites: "D4, D11"
    anti_pattern: "A conclusions section that restates the numbers rather than referencing them, which is where a value last regenerated two drafts ago goes to be quoted with the most confidence."

  - id: "recommendations"
    title: "Getting the most from this system"
    required: true
    order: 21
    purpose: "Advise what to do with THIS deployment, after first stating plainly what this deployment cannot do."
    inputs:
      - "findings"
      - "roofs"
      - "derived"
      - "assumptions"
      - "figures_of_merit"
      - "workload"
    invariants:
      - id: "RC-1"
        rule: "MANDATORY AND NOT REMOVABLE. A block titled as what this deployment cannot do is present and is rendered strictly BEFORE the first options table. A future author will want to lead with the upgrade path; leading with it inverts the reader's priorities, because a recommendation that requires different hardware or a different configuration of the thing measured is not advice about this machine."
        check: "block_present(recommendations, cannot_do) and block_order(recommendations, cannot_do, first_options_table)"
        cites: "learned in review, D9"
      - id: "RC-2"
        rule: "MANDATORY AND NOT REMOVABLE. Every recommendation that requires hardware other than the system under test, or a workload other than the one disclosed, is rendered inside the cannot-do block and may not appear as a row of an options table."
        check: "value_kind_absent(options_tables, out_of_deployment_recommendation)"
        cites: "learned in review, D9"
      - id: "RC-3"
        rule: "Every option row references envelope ids for the effect it claims, at the precision stored on those envelopes. No option row carries an authored number, and no row states an effect for which no envelope exists."
        check: "no_authored_digits(recommendations) and all_rendered_values_resolve(recommendations) and single_precision_per_value(document)"
        cites: "D1"
      - id: "RC-4"
        rule: "Any recommendation resting on a projection or an assumption renders that kind label and the rationale in the same row, and any value that is or inherits a floor renders as a bound."
        check: "field_rendered_with_every(kind_label, kind in [assumption, projection]) and floor_qualified(recommendations)"
        cites: "D8, shared-mode rule"
      - id: "RC-5"
        rule: "Recommendations rank only on ids declared in figures_of_merit; a recommendation that optimises a quantity the report never declared as a figure of merit fails the build."
        check: "rendered_ids_subset_of_declared(recommendations.ranking_ids)"
        cites: "D1"
    anti_pattern: "Opening with the change that would fix everything, so a reader who stops after the first table leaves believing the measured deployment can do what only a different one could, and never meets the ceiling that actually binds."

  - id: "open"
    title: "What is still open"
    required: true
    order: 22
    purpose: "List every question the run did not answer, each with the instrument or pass that would answer it."
    inputs:
      - "roofs[is_floor]"
      - "measurements[kind = enumerated]"
      - "assumptions[kind = projection]"
      - "figures_of_merit.self_assessment"
      - "warnings"
    invariants:
      - id: "OP-1"
        rule: "Every open item renders the instrument, run or window that would close it, taken from how_to_close or how_to_measure_true_ceiling. An open item with no closing action is a complaint and fails the build."
        check: "field_rendered_with_every(closing_action, open_item)"
        cites: "D8"
      - id: "OP-2"
        rule: "Every roof with is_floor true appears here with its how_to_measure_true_ceiling, so the floor is an outstanding work item and not only a caveat."
        check: "count_covered(roofs[is_floor], [open])"
        cites: "shared-mode rule"
      - id: "OP-3"
        rule: "Every enumerated value and every projection in the bundle is covered by this section or by limitations, and the union count matches the bundle count."
        check: "count_covered(measurements[kind = enumerated] + assumptions[kind = projection], [open, limitations])"
        cites: "D8"
      - id: "OP-4"
        rule: "Statements here about what has and has not been run externally are generated from tool.published, so this section cannot contradict reproducing or standing."
        check: "generated_from_flag(reproduction_status_sentence, tool.published)"
        cites: "D9"
    anti_pattern: "An open-questions list that names the interesting unknowns and quietly omits the ones the report needed to be true, above all the roofs that were only ever measured as floors."

  - id: "presentation-guidance"
    title: "How to read and present these results"
    required: false
    order: 23
    purpose: "Tell a reader which figures may be quoted onward, with what conditions attached, and which pairs must never be set side by side."
    inputs:
      - "figures_of_merit"
      - "measurements"
      - "derived"
      - "roofs"
      - "presentation"
    invariants:
      - id: "PG-1"
        rule: "Every figure this section says may be quoted is an id in figures_of_merit; it may not nominate a quotable value the report never declared."
        check: "rendered_ids_subset_of_declared(presentation-guidance.quotable_ids)"
        cites: "D1"
      - id: "PG-2"
        rule: "Every quotable value is rendered with the conditions and bounds that must travel with it, so a value quoted from this section arrives with its context."
        check: "field_rendered_with_every(conditions, quotable) and field_rendered_with_every(bound_by, quotable)"
        cites: "D4"
      - id: "PG-3"
        rule: "Every not_comparable_with prohibition declared in the bundle is rendered here as a pair that must not be shown together."
        check: "count_covered(document.not_comparable_with_pairs, [presentation-guidance, standing])"
        cites: "D4"
      - id: "PG-4"
        rule: "Every value that is or inherits a floor is listed as quotable only with bound wording."
        check: "floor_qualified(presentation-guidance)"
        cites: "shared-mode rule"
    anti_pattern: "Advice on presentation that recommends the cleanest-looking figures, which are usually the ones whose conditions are most easily lost on the way to somebody else's slide."

  - id: "standing"
    title: "Standing: what this may and may not be cited for"
    required: true
    order: 24
    purpose: "State the report's citation licence: which claims it supports, which it explicitly does not, and against what it is not comparable."
    inputs:
      - "scope"
      - "workload.not_claimed"
      - "measurements[kind = fixed-test-set]"
      - "tool"
      - "figures_of_merit.self_assessment"
    invariants:
      - id: "ST-1"
        rule: "Every scope.non_claims entry and every borrowed framework not_claimed line is rendered, and the union count matches the bundle."
        check: "count_covered(scope.non_claims + scope.borrowed_frameworks[].not_claimed, [standing])"
        cites: "D9"
      - id: "ST-2"
        rule: "Every fixed-test-set envelope renders its licenses and does_not_license lines here, so the citation licence for a gate lives with the standing statement and not only beside the gate."
        check: "count_covered(measurements[kind = fixed-test-set], [standing]) and field_rendered_with_every(does_not_license, fixed-test-set)"
        cites: "D12"
      - id: "ST-3"
        rule: "Every sentence about publication, availability or external reproduction is generated from tool.published and tool.source_url. No such sentence is authored anywhere in the document."
        check: "generated_from_flag(publication_status_sentence, tool.published)"
        cites: "D9"
      - id: "ST-4"
        rule: "Every not_comparable_with prohibition in the bundle is rendered here or in presentation-guidance, and the union count matches."
        check: "count_covered(document.not_comparable_with_pairs, [standing, presentation-guidance])"
        cites: "D4"
    anti_pattern: "A standing section that reads as a modest disclaimer while the abstract makes the broad claim, so the two are read by different audiences and only one of them is quoted."

  - id: "harness-walkthrough"
    title: "How it was measured: a walk through the harness"
    required: false
    order: 25
    purpose: "Trace the harness from invocation to artefact, so a reader can locate the code behind every value."
    inputs:
      - "tool"
      - "runs[].artifacts"
      - "derived[].computed_by"
      - "software_stack"
    invariants:
      - id: "HW-1"
        rule: "Every step names the artefact it writes, and every artefact named appears in some runs[].artifacts list."
        check: "count_covered(harness-walkthrough.artifact_names, runs[].artifacts)"
        cites: "D10"
      - id: "HW-2"
        rule: "Every derivation described here is a derived[] entry, and its computed_by path resolves inside the harness rather than beside the report. A derivation whose code lives next to the report is rendered as such, explicitly."
        check: "count_covered(derived, [harness-walkthrough]) and field_rendered_with_every(computed_by, derived)"
        cites: "D5"
      - id: "HW-3"
        rule: "tool.derivations_unit_tested is rendered, and the sentence about whether derivations are tested is generated from it."
        check: "generated_from_flag(derivation_testing_sentence, tool.derivations_unit_tested)"
        cites: "D5"
      - id: "HW-4"
        rule: "No result value is rendered here; the section describes mechanism and carries no digits outside verbatim blocks."
        check: "no_authored_digits(harness-walkthrough)"
        cites: "D1"
    anti_pattern: "A walkthrough of the harness the author remembers, describing a step that was refactored out, so a reader looking for the code that produced a value finds a different one."

  - id: "method-primer"
    title: "How these measurements actually work"
    required: false
    order: 26
    purpose: "Explain the mechanism behind each metric for a reader who has not met the domain, without introducing any new value."
    inputs:
      - "metrics"
      - "figures"
      - "measurements"
      - "derived"
    invariants:
      - id: "MP-1"
        rule: "Every metric explained here is defined in metrics, and no metric is introduced that appears nowhere else."
        check: "rendered_ids_subset_of_declared(method-primer.metric_names)"
        cites: "D1"
      - id: "MP-2"
        rule: "Any worked example either references envelope ids from the bundle or is rendered as illustrative_only and marked not citable."
        check: "no_authored_digits(method-primer) and field_rendered_with_every(illustrative_only_marker, illustrative_only = true)"
        cites: "D1, D8"
      - id: "MP-3"
        rule: "Any statement about how a quantity scales with an axis matches the scale declared on the corresponding figures[].axes entry, so an interpolation rule described here cannot contradict the axis the data is drawn on."
        check: "rendered_id_equals(method-primer.axis_scale, figures.axes.scale)"
        cites: "D5"
    anti_pattern: "A teaching section that invents a tidy example number, which is then quoted back as a measurement because a number is cited from wherever it is read."

  - id: "limitations"
    title: "Limitations"
    required: true
    order: 27
    purpose: "Collect every condition that limits what the report establishes, in one place, at full strength."
    inputs:
      - "warnings"
      - "runs[].warnings"
      - "roofs[is_floor]"
      - "assumptions"
      - "measurements"
      - "workload.not_claimed"
    invariants:
      - id: "LM-1"
        rule: "Every bundle-level warning and every run warning appears here or in document-control, and the union count equals the bundle count."
        check: "count_covered(warnings + runs[].warnings, [limitations, document-control])"
        cites: "shared-mode rule, D10"
      - id: "LM-2"
        rule: "Every roof with is_floor true is rendered here as a floor, with the consequence for every fraction derived from it."
        check: "count_covered(roofs[is_floor], [limitations]) and floor_qualified(limitations)"
        cites: "shared-mode rule, D1"
      - id: "LM-3"
        rule: "Every assumption and projection is rendered here or in assumptions with its rationale, and the union count equals the bundle count."
        check: "count_covered(assumptions, [limitations, assumptions])"
        cites: "D8"
      - id: "LM-4"
        rule: "Every value with n greater than one and no spread renders its spread_not_available reason, so a missing spread is a stated limitation rather than an absence."
        check: "field_rendered_with_every(spread_not_available, n > 1 and no spread)"
        cites: "D3"
      - id: "LM-5"
        rule: "No limitation is softened relative to the bundle text it comes from; the rendered string equals the bundle string."
        check: "generated_from_flag(limitation_text, warnings)"
        cites: "D9"
    anti_pattern: "A limitations section written as a courtesy, restating in mild language the caveats that appear at full strength in the data, so a reader who reads only this section is misinformed by the safest-looking part of the report."

  - id: "reproducing"
    title: "Reproducing this"
    required: true
    order: 28
    purpose: "Give a reader everything needed to run the same measurement on their own machine and to tell whether they got the same answer."
    inputs:
      - "tool"
      - "runs"
      - "workload"
      - "software_stack.configuration"
      - "derived"
    invariants:
      - id: "RP-1"
        rule: "tool.name, tool.version and tool.source_url are rendered, and the availability sentence is generated from tool.published. A claim that the harness is published while tool.published is false fails the build, and so does the reverse."
        check: "generated_from_flag(availability_sentence, tool.published)"
        cites: "D9"
      - id: "RP-2"
        rule: "Every run renders its artifacts list, its comparability_fingerprint.hash and the fingerprint inputs string verbatim, so a reader can recompute the hash rather than trust it."
        check: "row_count_equals(reproduce_run_table, count(runs)) and field_rendered_with_every(comparability_fingerprint.inputs, run)"
        cites: "D10, D4"
      - id: "RP-3"
        rule: "The workload is rendered as a regeneration recipe: generation.template, generation.uniqueness_mechanism and generation.seed for a synthetic corpus, or corpus.identity, corpus.version and corpus.sampling_method otherwise."
        check: "block_present(reproducing, workload_recipe)"
        cites: "D8"
      - id: "RP-4"
        rule: "software_stack.configuration.verbatim is rendered in a block flagged verbatim, so the reader launches the same stack rather than a reconstruction of it."
        check: "block_present(reproducing, configuration_verbatim)"
        cites: "D9"
      - id: "RP-5"
        rule: "The agreement threshold a reader should hold their own numbers to is rendered by reference to the derived reproducibility threshold, not restated."
        check: "rendered_id_equals(reproducing.threshold, reproducibility.threshold)"
        cites: "D1, D5"
    anti_pattern: "Instructions for reproducing a measurement whose harness is not obtainable, stated in one section while another section admits nobody outside has run it, with no field anywhere that could have caught the contradiction."

  - id: "version-history"
    title: "Version history"
    required: true
    order: 29
    purpose: "Record every edition, in order, with the values that moved and the run provenance that changed, so no number was ever revised silently."
    inputs:
      - "version_history"
      - "measurements[].supersedes"
      - "derived[].supersedes"
      - "runs"
    invariants:
      - id: "VH-1"
        rule: "The rendered chain is complete: following previous_version from the newest entry visits every version_history entry exactly once and terminates at null exactly once. A missing edition breaks the chain and fails the build."
        check: "chain_complete(version_history) and row_count_equals(version_table, count(version_history))"
        cites: "D7"
      - id: "VH-2"
        rule: "Rows are rendered newest first and the rendered order equals the chain order; the order is generated from previous_version, never from the order the entries happen to sit in."
        check: "generated_from_flag(version_row_order, version_history[].previous_version)"
        cites: "D7"
      - id: "VH-3"
        rule: "Every entry with measured_values_moved true renders one row per moved_values entry with value_id, from, to and why, and the rendered count equals the bundle count. Every envelope carrying supersedes is covered by one of those rows."
        check: "row_count_equals(moved_values_rows, count(version_history[].moved_values)) and count_covered(document.supersedes_entries, [version-history])"
        cites: "D7, D3"
      - id: "VH-4"
        rule: "Every entry renders run_provenance_changed and, where true, which runs entered or left, because an edition can change its contributing artefacts without a single printed number moving."
        check: "field_rendered_with_every(run_provenance_changed, version_entry)"
        cites: "D10"
      - id: "VH-5"
        rule: "Every entry renders verified_by and its defects_closed list, so the register of review defects lives in the artefact rather than in somebody's mailbox."
        check: "field_rendered_with_every(verified_by, version_entry)"
        cites: "D7, D12"
    anti_pattern: "A history maintained by hand at the end of a long edit, missing the two versions the author never published widely and listing the rest in the order they came to mind."

archetypes:
  note: "B-C1. Reusable section shapes a report instantiates as many times as its evidence requires. Each instance declares its own id, title, purpose, inputs and uses; it inherits every universal invariant plus the archetype invariants below. Adding an evidence section to a report never means adding prose outside the contract."
  instantiation_rule: "An instance is placed by an insert_after field naming an existing section id, never by a number. Instances are numbered by the renderer along with everything else."
  items:

    - id: "regime-analysis"
      title_pattern: "One roof, more than one regime"
      repeatable: true
      purpose: "Show that a single roof behaves as two or more distinct regimes across the workload space, and where the boundary sits."
      inputs:
        - "roofs"
        - "figures"
        - "derived"
        - "measurements"
      invariants:
        - id: "RA-1"
          rule: "Every regime is rendered with the range of the axis over which it holds, and the boundary between regimes is a derived envelope with its inputs and formula on the page."
          check: "derivation_rendered(instance.boundary) and field_rendered_with_every(binding_regime, regime_row)"
          cites: "D5"
        - id: "RA-2"
          rule: "The figure behind the regimes declares its axis scale, and any interpolation described in the section is consistent with that scale. A quantity linear in the axis variable may not be interpolated on a logarithmic reading of it."
          check: "field_rendered_with_every(axes.scale, figure) and rendered_id_equals(instance.interpolation_scale, figure.axes.scale)"
          cites: "D5"
        - id: "RA-3"
          rule: "No value derived in one regime is rendered as applying to the other, and no headline value averages across regimes."
          check: "no_aggregate_across(binding_regime)"
          cites: "D1"
      anti_pattern: "Fitting one curve across a boundary the data plainly shows, so a ceiling derived from the fit is unreproducible from the published points and nobody can see why."

    - id: "attribution-breakdown"
      title_pattern: "Where the work actually goes"
      repeatable: true
      purpose: "Account for one unit of work as a sum of named components, with an explicit residual."
      inputs:
        - "derived"
        - "measurements"
        - "system_under_test"
        - "software_stack"
      invariants:
        - id: "AT-1"
          rule: "Every component is a derived envelope naming its inputs and formula, and every geometric or configuration constant used comes from the bundle rather than from the code. requires_inputs_present is true on each, so a missing input fails the build instead of falling back to a constant."
          check: "derivation_rendered(instance) and field_rendered_with_every(requires_inputs_present, derived)"
          cites: "D11, D5"
        - id: "AT-2"
          rule: "The residual is rendered as its own envelope, with a preregistered_bar whose set_before_measurement is true and whose set_on date is rendered. A residual declared acceptable after it was seen is rendered as a post-hoc observation, not as a met bar."
          check: "block_present(instance, residual) and field_rendered_with_every(preregistered_bar, residual)"
          cites: "D12"
        - id: "AT-3"
          rule: "The components and the residual sum to the whole at the stored precision, checked by the linter against the envelopes rather than by reading the printed column."
          check: "derivation_rendered(instance.total) and single_precision_per_value(document)"
          cites: "D1"
        - id: "AT-4"
          rule: "Any attribution consistent with a mechanism but not proof of it renders the caveat naming the evidence that would settle it."
          check: "field_rendered_with_every(caveat, attribution)"
          cites: "D4, D11"
      anti_pattern: "A breakdown that balances because one machine's constants are baked into the derivation, so on any other machine it produces a confident wrong answer instead of refusing to answer."

    - id: "capacity-envelope"
      title_pattern: "What load it can bear"
      repeatable: true
      purpose: "State how much concurrent load the system sustains within a declared bound, and where the bound is first exceeded."
      inputs:
        - "measurements"
        - "derived"
        - "figures_of_merit"
        - "figures"
        - "assumptions"
      invariants:
        - id: "CE-1"
          rule: "Every capacity figure renders the bound it holds within, by id, from figures_of_merit.primary.bound_by or an explicitly named service_level. A capacity quoted without its bound fails the build."
          check: "field_rendered_with_every(service_level_or_bound_id, capacity_value)"
          cites: "D4"
        - id: "CE-2"
          rule: "Every capacity figure renders its concurrency and its problem size conditions, and the saturation point is a derived envelope rather than a reading taken off a chart by eye."
          check: "field_rendered_with_every(conditions.concurrency, capacity_value) and derivation_rendered(instance.saturation_point)"
          cites: "D4, D5"
        - id: "CE-3"
          rule: "Any extrapolation beyond the measured concurrency range is an envelope of kind projection with its rationale and how_to_close rendered in place."
          check: "field_rendered_with_every(rationale, kind = projection)"
          cites: "D8"
      anti_pattern: "A user count derived from a mean rate with no latency bound and no stated mixture, which then travels into a capacity plan as though it had been measured."

    - id: "sensitivity-sweep"
      title_pattern: "What a workload parameter does to the result"
      repeatable: true
      purpose: "Show how the headline quantity moves as one workload parameter is varied, and what may be concluded from the spread."
      inputs:
        - "measurements"
        - "figures"
        - "workload.distribution"
        - "assumptions"
      invariants:
        - id: "SW-1"
          rule: "Every point in the sweep is an envelope with the swept condition key set, and the figure and its table view render the same ids. A point that exists only inside the chart fails the build."
          check: "all_rendered_values_resolve(instance) and rendered_id_equals(figure.table_view.value_ids, instance.point_ids)"
          cites: "D1"
        - id: "SW-2"
          rule: "Where the sweep is weighted into a single figure, workload.distribution.kind and weighted_summary_permitted are rendered, and no weighted figure is rendered when permission is false."
          check: "field_rendered_with_every(distribution.kind_label, weighted_value) and value_kind_absent(instance, weighted_summary_of_unpermitted_mixture)"
          cites: "D8"
        - id: "SW-3"
          rule: "The spread across the sweep is rendered with scope across-conditions, and is not quoted as a run-to-run or unit-to-unit spread."
          check: "field_rendered_with_every(spread.scope, spread)"
          cites: "D2, D3"
      anti_pattern: "Presenting an assumed mixture as the answer instead of presenting the spread, so a chosen weighting becomes the number everyone quotes."

    - id: "co-resident-service"
      title_pattern: "A second service on the same system"
      repeatable: true
      purpose: "Report a secondary workload measured alongside the primary one, on its own disclosed terms."
      inputs:
        - "workload.secondary_workloads"
        - "measurements"
        - "derived"
        - "runs"
      invariants:
        - id: "CR-1"
          rule: "The instance renders the full workload disclosure of its own secondary_workloads entry: corpus kind, size control, cache defeat and not_claimed. Inheriting the primary workload disclosure fails the build."
          check: "block_present(instance, corpus_disclosure) and block_present(instance, not_claimed)"
          cites: "D8"
        - id: "CR-2"
          rule: "Every value here renders its mode, and where the two services were resident together, the primary roofs taken under that residency are rendered as floors."
          check: "field_rendered_with_every(mode, value) and floor_qualified(instance)"
          cites: "shared-mode rule"
        - id: "CR-3"
          rule: "No value from this service is rendered in the same table or sentence as a primary-workload value unless their comparability keys match or the mismatch is rendered as a caveat."
          check: "conditions_match_or_caveat(secondary_value, primary_value)"
          cites: "D4"
      anti_pattern: "Reporting a co-resident service against the primary workload disclosure, so its rate is read as comparable when its inputs, its sizes and its caching were never the same."

    - id: "principal-finding"
      title_pattern: "The finding the report exists for"
      repeatable: true
      purpose: "Argue the single most consequential result at length, with the evidence and the alternative explanations."
      inputs:
        - "roofs"
        - "derived"
        - "measurements"
        - "figures"
      invariants:
        - id: "PF-1"
          rule: "The roof or mechanism named here is the same id named binding in workload-vs-roofs, abstract, headline and findings."
          check: "rendered_id_equals(instance.binding_roof, workload-vs-roofs.binding_roof)"
          cites: "D1"
        - id: "PF-2"
          rule: "Every alternative explanation considered renders the value that rules it out, by id. An alternative dismissed without a value fails the build."
          check: "all_rendered_values_resolve(instance) and value_kind_present(instance, measured, 1)"
          cites: "D1, D11"
        - id: "PF-3"
          rule: "Where the finding rests on a floor, every fraction supporting it renders as an upper bound and the finding states what an exclusive pass would change."
          check: "floor_qualified(instance) and block_present(instance, what_exclusive_would_change)"
          cites: "shared-mode rule"
      anti_pattern: "Stating the finding with the strongest number available rather than the most comparable one, so the argument stands on a pairing taken from two different conditions."

    - id: "metric-self-assessment"
      title_pattern: "How good is the metric selection"
      repeatable: false
      purpose: "Grade the report's own choice of figures, including the figures it does not have."
      inputs:
        - "figures_of_merit.self_assessment"
        - "figures_of_merit"
        - "open"
      invariants:
        - id: "MS-1"
          rule: "Every figures_of_merit.self_assessment entry is rendered with its question, verdict and detail, and the row count matches the bundle."
          check: "row_count_equals(self_assessment_table, count(figures_of_merit.self_assessment))"
          cites: "D12"
        - id: "MS-2"
          rule: "Every negative verdict is carried into open or limitations as an item, so a self-criticism cannot be made and then dropped."
          check: "count_covered(figures_of_merit.self_assessment[negative], [open, limitations])"
          cites: "D9, D12"
        - id: "MS-3"
          rule: "No new value is introduced; this section grades the selection and carries no digits of its own."
          check: "no_authored_digits(instance)"
          cites: "D1"
      anti_pattern: "Grading the metric selection favourably in the same document that chose it, with no gap listed, which converts a self-assessment into a second advertisement."

coverage_map:
  note: "B-C1 evidence. One row per section of the source edition that this manifest was derived from, in that edition's order, plus its figures. Each row describes what the section DOES rather than quoting its title, because a manifest may not carry any report's domain vocabulary (B-C2) and may not identify a section by number (D6). Nothing in that edition needs prose outside the contract, and no invariant was weakened to make it fit."
  rows:
    - source: "Cover, with the register of contributing run artefacts"
      expressed_by: "document-control"
    - source: "Opening summary a reader will quote"
      expressed_by: "abstract"
    - source: "Cover table of the figures the report will be cited for"
      expressed_by: "headline"
    - source: "Statement of what the report answers and refuses"
      expressed_by: "what-this-is"
    - source: "Declaration of the ranked quantity and its bound"
      expressed_by: "figures-of-merit"
    - source: "Description of the measured machine, unit by unit"
      expressed_by: "system-under-test"
    - source: "The execution stack and its launch configuration"
      expressed_by: "software-stack"
    - source: "What was submitted, how sized, how cache-defeated"
      expressed_by: "workload"
    - source: "Definitions of every quantity printed"
      expressed_by: "metrics"
    - source: "The instrument or counter behind each quantity"
      expressed_by: "metric-origins"
    - source: "One provenance row per value in the bundle"
      expressed_by: "provenance"
    - source: "Register of values chosen rather than observed"
      expressed_by: "assumptions"
    - source: "What each measurement pass was for, and its mode"
      expressed_by: "strategy"
    - source: "The set of ceilings the work is measured against"
      expressed_by: "roofs"
    - source: "Reference figures set beside measured counterparts"
      expressed_by: "datasheet-vs-measured"
    - source: "One roof shown to behave as two distinct regimes"
      expressed_by: "archetype regime-analysis"
    - source: "One unit of work accounted for component by component"
      expressed_by: "archetype attribution-breakdown"
    - source: "The work plotted against the roofs, with fractions"
      expressed_by: "workload-vs-roofs"
    - source: "The single most consequential result, argued at length"
      expressed_by: "archetype principal-finding"
    - source: "Sustainable concurrent load within a declared bound"
      expressed_by: "archetype capacity-envelope"
    - source: "How much the measurements move, and the noise floor"
      expressed_by: "reproducibility"
    - source: "A sweep of the headline quantity over one workload parameter"
      expressed_by: "archetype sensitivity-sweep"
    - source: "A fixed test set with a pass rule and a licence"
      expressed_by: "quality-gate"
    - source: "A second service measured on the same system"
      expressed_by: "archetype co-resident-service"
    - source: "Cost per unit of work, from capital and tariffs"
      expressed_by: "cost"
    - source: "What the measurements establish, tied to values"
      expressed_by: "findings"
    - source: "Advice for this deployment, cannot-do block first"
      expressed_by: "recommendations"
    - source: "Questions the runs did not answer, with closing actions"
      expressed_by: "open"
    - source: "Which figures may be quoted onward, and how"
      expressed_by: "presentation-guidance"
    - source: "The report grading its own choice of figures"
      expressed_by: "archetype metric-self-assessment"
    - source: "The citation licence and the explicit non-claims"
      expressed_by: "standing"
    - source: "A walk from harness invocation to artefact"
      expressed_by: "harness-walkthrough"
    - source: "A primer on the mechanism behind each quantity"
      expressed_by: "method-primer"
    - source: "Every condition that limits what is established"
      expressed_by: "limitations"
    - source: "Everything needed to run the same measurement"
      expressed_by: "reproducing"
    - source: "Every edition, in a walkable chain"
      expressed_by: "version-history"
    - source: "Every chart, with the table that makes it checkable"
      expressed_by: "figures[] in the bundle, rendered inside the owning section, table_view required on each"

defect_index:
  note: "Which sections and invariants stand between the report and each historical defect. A future author proposing to relax an invariant can read here what returns if they do."
  rows:
    - defect: "D1"
      summary: "One rate printed as three different percentages in a table, in prose and in a recommendation."
      guarded_by: "U-1, U-2, U-9, HL-1, WVR-1, WVR-5, RC-3, PV-1"
    - defect: "D2"
      summary: "A cap counted over one unit in one section and both units in another."
      guarded_by: "SUT-1, HL-4, PV-5, RE-2, SW-3"
    - defect: "D3"
      summary: "A sustained value in prose transcribed from an older run."
      guarded_by: "U-1, U-4, HL-2, PV-2, RE-3, VH-3"
    - defect: "D4"
      summary: "A burst figure paired against a figure taken at a different problem size in another run, presented as like-for-like."
      guarded_by: "U-7, U-10, HL-2, HL-3, WVR-2, DVM-3, CE-1"
    - defect: "D5"
      summary: "A ceiling nobody could reproduce, derived by a script beside the report interpolating on the wrong scale."
      guarded_by: "PV-3, RF-5, RE-1, HW-2, HW-3, RA-1, RA-2"
    - defect: "D6"
      summary: "Hard-coded section cross-references that went stale after reordering."
      guarded_by: "U-3, template.numbering_rule, archetypes.instantiation_rule"
    - defect: "D7"
      summary: "A version history missing two of its own versions and listed out of order."
      guarded_by: "VH-1, VH-2, VH-3, VH-5, DC-5"
    - defect: "D8"
      summary: "An assumed input mixture presented as if measured."
      guarded_by: "U-6, WL-4, AS-1, AS-2, AS-4, SW-2, CO-1"
    - defect: "D9"
      summary: "Two sections contradicting each other about whether the harness had been published."
